# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name *.eben-ai-one.ebenaisolutions.pt;
    return 301 https://$host$request_uri;
}

# n8n Service
server {
    listen 443 ssl;
    server_name n8n.eben-ai-one.ebenaisolutions.pt;

    ssl_certificate /etc/letsencrypt/live/n8n.eben-ai-one.ebenaisolutions.pt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n8n.eben-ai-one.ebenaisolutions.pt/privkey.pem;

    location / {
        proxy_pass http://n8n:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Baserow Service
server {
    listen 443 ssl;
    server_name baserow.eben-ai-one.ebenaisolutions.pt;

    ssl_certificate /etc/letsencrypt/live/n8n.eben-ai-one.ebenaisolutions.pt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n8n.eben-ai-one.ebenaisolutions.pt/privkey.pem;

    client_max_body_size 200M;

    location / {
        proxy_pass http://baserow:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /ws/ {
        proxy_pass http://baserow:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

