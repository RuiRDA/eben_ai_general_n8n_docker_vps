name: maia
x-hardening: &hardening
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  pids_limit: 256
services:
  postgres:
    image: maia-postgres:17.11-security1
    build: {context: ., dockerfile: images/postgres.Dockerfile}
    restart: unless-stopped
    environment:
      POSTGRES_USER: maia_migrator
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [postgres_password, maia_runtime_password, n8n_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-maia.sh:ro
    networks: [database]
    shm_size: 256mb
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U maia_migrator -d postgres']
      interval: 10s
      timeout: 5s
      retries: 12
  app:
    <<: *hardening
    image: ${MAIA_APP_IMAGE:?Set an immutable tested app image tag or digest}
    env_file: ./private/app.env
    environment:
      NODE_ENV: production
      TRUST_PROXY_HEADERS: 'true'
      ENABLE_SCRAPINGS: 'false'
      OUTBOUND_ENABLED: 'false'
      TZ: Europe/Lisbon
    networks: [database, application, outbound]
    depends_on:
      postgres: {condition: service_healthy}
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777', '/app/.next/cache:size=64m,uid=1001,gid=1001']
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  n8n:
    <<: *hardening
    image: docker.n8n.io/n8nio/n8n:2.37.10
    user: '1000:1000'
    env_file: ./private/n8n.env
    environment:
      NODE_ENV: production
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5678
      N8N_SECURE_COOKIE: 'false'
      GENERIC_TIMEZONE: Europe/Lisbon
      TZ: Europe/Lisbon
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n_runtime
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'true'
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: 'true'
      N8N_RESTRICT_FILE_ACCESS_TO: /files
      N8N_COMMUNITY_PACKAGES_ENABLED: 'false'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_PUBLIC_API_DISABLED: 'true'
      N8N_SSRF_PROTECTION_ENABLED: 'true'
      N8N_SSRF_BLOCKED_IP_RANGES: '0.0.0.0/0,::/0'
      N8N_SSRF_ALLOWED_HOSTNAMES: 'app'
      NODES_INCLUDE: '["n8n-nodes-base.scheduleTrigger","n8n-nodes-base.httpRequest","n8n-nodes-base.if","n8n-nodes-base.manualTrigger","n8n-nodes-base.noOp"]'
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.code","n8n-nodes-base.readWriteFile","n8n-nodes-base.ssh","n8n-nodes-base.ftp"]'
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: 'false'
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: 'false'
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: 24
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 1000
      EXECUTIONS_TIMEOUT: 120
      EXECUTIONS_TIMEOUT_MAX: 120
      N8N_CONCURRENCY_PRODUCTION_LIMIT: 3
    ports: ['127.0.0.1:5678:5678']
    volumes: ['n8n_data:/home/node/.n8n']
    networks: [database, application, outbound]
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 1536m
    cpus: 1
  proxy:
    <<: *hardening
    image: maia-caddy:2.11.4-security1
    build: {context: ., dockerfile: images/caddy.Dockerfile}
    cap_add: [NET_BIND_SERVICE]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set the application domain}
    ports: ['80:80', '443:443']
    volumes: ['./Caddyfile:/etc/caddy/Caddyfile:ro', 'caddy_data:/data', 'caddy_config:/config']
    networks: [application, outbound]
    read_only: true
    tmpfs: ['/tmp:size=16m']
    mem_limit: 256m
    cpus: 0.5
volumes:
  postgres_data:
  n8n_data:
  caddy_data:
  caddy_config:
networks:
  database: {internal: true}
  application: {internal: true}
  outbound: {}
secrets:
  postgres_password: {file: ./private/postgres_password}
  maia_runtime_password: {file: ./private/maia_runtime_password}
  n8n_password: {file: ./private/n8n_password}
