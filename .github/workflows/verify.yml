name: Verify private Maia infrastructure
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0, persist-credentials: false}
      - run: python scripts/validate.py
      - name: Prepare synthetic configuration only
        run: |
          mkdir private
          cp private.example/app.env private/app.env
          cp private.example/n8n.env private/n8n.env
          touch private/postgres_password private/maia_runtime_password private/n8n_password
          APP_DOMAIN=maia.example.test MAIA_APP_IMAGE=maia:test docker compose config --quiet
      - run: sh scripts/security-tools.sh
      - run: .security-tools/gitleaks git . --redact=100 --no-banner
      - name: Scan pinned upstream images
        run: |
          .security-tools/trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 postgres:17.11-alpine3.23
          .security-tools/trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 caddy:2.11.4-alpine
          .security-tools/trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 docker.n8n.io/n8nio/n8n:2.37.10
      - name: Validate proxy configuration
        run: docker run --rm -e APP_DOMAIN=maia.example.test -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile
